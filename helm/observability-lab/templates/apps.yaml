{{- range $name, $service := .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "observability-lab.fullname" $ }}-{{ $name }}
  labels:
    {{- include "observability-lab.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "observability-lab.fullname" $ }}-{{ $name }}
  ports:
    - name: http
      port: {{ $service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "observability-lab.fullname" $ }}-{{ $name }}
  labels:
    {{- include "observability-lab.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $.Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "observability-lab.fullname" $ }}-{{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "observability-lab.fullname" $ }}-{{ $name }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: {{ $name }}
          image: {{ index (index $.Values.images $.Values.instrumentationMode) $name | quote }}
          imagePullPolicy: {{ $.Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $service.port }}
          env:
            - name: OTEL_SERVICE_NAME
              value: {{ $service.serviceName | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $.Values.otel.collectorEndpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "5000"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ printf "deployment.environment.name=%s,service.namespace=%s" $.Values.otel.environment $.Values.otel.namespace | quote }}
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: otlp
            {{- if eq $name "gateway" }}
            - name: ORDERS_URL
              value: http://{{ include "observability-lab.fullname" $ }}-orders:8001
            {{- else if eq $name "orders" }}
            - name: INVENTORY_URL
              value: http://{{ include "observability-lab.fullname" $ }}-inventory:8002
            - name: DATABASE_HOST
              value: {{ printf "%s-database" (include "observability-lab.fullname" $) | quote }}
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "observability-lab.fullname" $ }}-postgres
                  key: database
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "observability-lab.fullname" $ }}-postgres
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "observability-lab.fullname" $ }}-postgres
                  key: password
            {{- else if eq $name "inventory" }}
            - name: DATABASE_HOST
              value: {{ printf "%s-database" (include "observability-lab.fullname" $) | quote }}
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "observability-lab.fullname" $ }}-postgres
                  key: database
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "observability-lab.fullname" $ }}-postgres
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "observability-lab.fullname" $ }}-postgres
                  key: password
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
{{- end }}
